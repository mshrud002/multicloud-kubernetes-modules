---
# ClusterAutoscaler configuration for OpenShift
apiVersion: "autoscaling.openshift.io/v1"
kind: "ClusterAutoscaler"
metadata:
  name: "default"
spec:
  podPriorityThreshold:
    defaultPriority: -10
  resourceLimits:
    maxNodesTotal: 100
    cores:
      min: 8
      max: 256
    memory:
      min: 32
      max: 1024
  scaleDown:
    enabled: true
    delayAfterAdd: 10m
    delayAfterDelete: 10s
    delayAfterFailure: 3m
    unneededTime: 10m
    unreadyTime: 20m
---
# MachineAutoscaler - attach to a specific MachineSet
apiVersion: "autoscaling.openshift.io/v1beta1"
kind: "MachineAutoscaler"
metadata:
  name: "default-worker-autoscaler"
  namespace: "openshift-machine-api"
spec:
  minReplicas: 1
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: machine.openshift.io/v1beta1
    kind: MachineSet
    name: "${CLUSTER_NAME}-worker-${AWS_REGION}a"

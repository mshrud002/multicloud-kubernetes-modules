---
# MachineSet template for OpenShift on AWS
# This is applied after the cluster is provisioned to create additional machine pools
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: ${CLUSTER_NAME}-worker-${AWS_REGION}a
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: ${CLUSTER_NAME}
spec:
  replicas: 3
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: ${CLUSTER_NAME}
      machine.openshift.io/cluster-api-machineset: ${CLUSTER_NAME}-worker-${AWS_REGION}a
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: ${CLUSTER_NAME}
        machine.openshift.io/cluster-api-machineset: ${CLUSTER_NAME}-worker-${AWS_REGION}a
    spec:
      providerSpec:
        value:
          apiVersion: awsproviderconfig.openshift.io/v1beta1
          kind: AWSMachineProviderConfig
          ami:
            id: ${AMI_ID}
          instanceType: ${INSTANCE_TYPE}
          placement:
            region: ${AWS_REGION}
            availabilityZone: ${AWS_REGION}a
          subnet:
            filters:
            - name: tag:Name
              values:
              - ${CLUSTER_NAME}-worker-${AWS_REGION}a
          securityGroups:
          - filters:
            - name: tag:Name
              values:
              - ${CLUSTER_NAME}-worker-sg
          userDataSecret:
            name: worker-user-data
          credentialsSecret:
            name: aws-cloud-credentials
          tags:
          - name: kubernetes.io/cluster/${CLUSTER_NAME}
            value: owned
          iamInstanceProfile:
            id: ${CLUSTER_NAME}-worker-profile
          metadataServiceOptions:
            authentication: Required
          deviceIndex: 0
      taints:
      - key: node.kubernetes.io/instance-type
        value: ${INSTANCE_TYPE}
        effect: NoSchedule
---
# MachineAutoscaler to enable auto-scaling for the MachineSet
apiVersion: autoscaling.openshift.io/v1beta1
kind: MachineAutoscaler
metadata:
  name: ${CLUSTER_NAME}-worker-${AWS_REGION}a
  namespace: openshift-machine-api
spec:
  minReplicas: 1
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: machine.openshift.io/v1beta1
    kind: MachineSet
    name: ${CLUSTER_NAME}-worker-${AWS_REGION}a
